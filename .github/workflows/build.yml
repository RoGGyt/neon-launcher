name: Сборка лаунчера

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # каждая сборка получает новую версию 1.0.<номер сборки> — по ней работает автообновление
      - name: Версия
        run: |
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Установка зависимостей
        run: npm install

      - name: Сборка и публикация
        run: npm run build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Описание релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release edit "v$VERSION" --latest --title "Neon Launcher $VERSION" --notes "**NeonLauncher-Setup-$VERSION.exe** — установщик, дальше лаунчер обновляется сам.
          **NeonLauncher-portable-$VERSION.exe** — без установки (обновлять вручную).

          Если Windows покажет «Windows защитила ваш компьютер»: «Подробнее» → «Выполнить в любом случае».

          Изменения: $COMMIT_MSG"
