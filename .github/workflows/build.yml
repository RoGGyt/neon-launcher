name: Сборка лаунчера

on:
  push:
    branches: [main]
    # правки сайта не пересобирают лаунчер
    paths-ignore: ['site/**', 'README.md', '.github/workflows/client.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Neon Client (главное меню в игре) — отдельные jar под каждую версию Minecraft
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Сборка клиента
        working-directory: client
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log
      - name: Ошибка сборки клиента
        if: failure()
        run: echo "::error title=Neon Client::$(grep -E 'error:|What went wrong' -A2 client/build.log | head -30 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Переименовать jar
        run: |
          mkdir -p out
          for p in mc1201 mc12111; do cp client/$p/build/libs/neonclient-$p-*.jar out/neonclient-$p.jar; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: neonclient
          path: out/*.jar

  windows:
    needs: client
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # каждая сборка получает новую версию 1.0.<номер сборки> — по ней работает автообновление
      - name: Версия
        run: |
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Neon Client в ресурсы
        uses: actions/download-artifact@v4
        with:
          name: neonclient
          path: resources

      # нативная библиотека QUIC для e4all: с natives.e4mc.link из России часто не скачивается,
      # поэтому кладём её в лаунчер (имя берём из самого e4all, как его ищет мод)
      - name: Нативки e4all
        run: |
          mkdir -p resources/e4mc
          python - <<'PY'
          import io, json, re, struct, urllib.request, zipfile, hashlib, os
          UA = {'User-Agent': 'RoGGyt/neon-launcher (build)'}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
          def strings(b):
              out, n, o, i = [], struct.unpack('>H', b[8:10])[0], 10, 1
              while i < n:
                  t = b[o]; o += 1
                  if t == 1:
                      l = struct.unpack('>H', b[o:o+2])[0]; out.append(b[o+2:o+2+l].decode('utf8', 'replace')); o += 2 + l
                  elif t in (3, 4, 9, 10, 11, 12, 17, 18): o += 4
                  elif t in (5, 6): o += 8; i += 1
                  elif t in (7, 8, 16, 19, 20): o += 2
                  elif t == 15: o += 3
                  else: break
                  i += 1
              return out
          suffixes = set()
          for mc in ('1.20.1', '1.21.11'):
              q = 'loaders=%5B%22fabric%22%5D&game_versions=%5B%22' + mc + '%22%5D'
              vers = json.loads(get('https://api.modrinth.com/v2/project/e4all/version?' + q))
              for v in vers[:2]:
                  f = next((f for f in v['files'] if f['primary']), v['files'][0])
                  z = zipfile.ZipFile(io.BytesIO(get(f['url'])))
                  try:
                      s = strings(z.read('io/netty/incubator/codec/quic/Quiche.class'))
                  except KeyError:
                      continue
                  suffixes |= {x for x in s if re.fullmatch(r'_\d+', x)}
          print('suffixes', suffixes)
          for suf in sorted(suffixes):
              for arch in ('x86_64', 'aarch_64'):
                  name = f'netty_quiche_windows_{arch}{suf}.dll'
                  try:
                      data = get('https://natives.e4mc.link/' + name)
                  except Exception as e:
                      print('skip', name, e); continue
                  open(os.path.join('resources', 'e4mc', name), 'wb').write(data)
                  print(name, len(data), hashlib.sha256(data).hexdigest())
          ok = [f for f in os.listdir(os.path.join('resources', 'e4mc')) if 'x86_64' in f]
          if not ok:
              raise SystemExit('no e4mc natives downloaded')
          PY
          ls -la resources/e4mc

      - name: Установка зависимостей
        run: npm install

      - name: Сборка
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          npx electron-builder --win --publish never 2>&1 | tee -a build.log
          ls -la release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # exe + latest.yml + blockmap: по latest.yml установленный лаунчер узнаёт о новой версии
      - name: Публикация в Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          NOTES="**NeonLauncher-Setup-$VERSION.exe** — установщик, дальше лаунчер обновляется сам.
          **NeonLauncher-portable-$VERSION.exe** — без установки (обновлять вручную).

          Если Windows покажет «Windows защитила ваш компьютер»: «Подробнее» → «Выполнить в любом случае».

          Изменения: $COMMIT_MSG"
          gh release create "v$VERSION" release/*.exe release/latest.yml release/*.blockmap \
            --title "Neon Launcher $VERSION" --notes "$NOTES" --latest

      - name: Показать ошибку сборки
        if: failure()
        run: |
          [ -f build.log ] && echo "::error title=Сборка::$(tail -n 40 build.log | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')" || true
