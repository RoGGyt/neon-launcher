name: Сборка лаунчера

on:
  push:
    branches: [main]
    # правки сайта не пересобирают лаунчер
    paths-ignore: ['site/**', 'README.md', '.github/workflows/client.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Neon Client (главное меню в игре) — отдельные jar под каждую версию Minecraft
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Сборка клиента
        working-directory: client
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log
      - name: Ошибка сборки клиента
        if: failure()
        run: echo "::error title=Neon Client::$(grep -E 'error:|What went wrong' -A2 client/build.log | head -30 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Переименовать jar
        run: |
          mkdir -p out
          for p in mc1201 mc12111; do cp client/$p/build/libs/neonclient-$p-*.jar out/neonclient-$p.jar; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: neonclient
          path: out/*.jar

  windows:
    needs: client
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # каждая сборка получает новую версию 1.0.<номер сборки> — по ней работает автообновление
      - name: Версия
        run: |
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Neon Client в ресурсы
        uses: actions/download-artifact@v4
        with:
          name: neonclient
          path: resources

      - name: Установка зависимостей
        run: npm install

      - name: Сборка
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          npx electron-builder --win --publish never 2>&1 | tee -a build.log
          ls -la release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # exe + latest.yml + blockmap: по latest.yml установленный лаунчер узнаёт о новой версии
      - name: Публикация в Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          NOTES="**NeonLauncher-Setup-$VERSION.exe** — установщик, дальше лаунчер обновляется сам.
          **NeonLauncher-portable-$VERSION.exe** — без установки (обновлять вручную).

          Если Windows покажет «Windows защитила ваш компьютер»: «Подробнее» → «Выполнить в любом случае».

          Изменения: $COMMIT_MSG"
          gh release create "v$VERSION" release/*.exe release/latest.yml release/*.blockmap \
            --title "Neon Launcher $VERSION" --notes "$NOTES" --latest

      - name: Показать ошибку сборки
        if: failure()
        run: |
          [ -f build.log ] && echo "::error title=Сборка::$(tail -n 40 build.log | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')" || true
