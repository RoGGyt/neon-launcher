name: Сборка Neon Client

# только вручную: собирает клиент и выгружает сигнатуры классов Minecraft для разработки
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Сборка
        working-directory: client
        run: |
          set -o pipefail
          gradle build --continue --no-daemon 2>&1 | tee build.log

      - name: Сигнатуры классов Minecraft (для разработки)
        if: always()
        run: |
          mkdir -p notes
          for v in 1.20.1 1.21.11; do
            find client/.gradle ~/.gradle -name "*.jar" -path "*minecraft*" 2>/dev/null | grep "$v" >> notes/alljars.txt || true
            JAR=$(find client/.gradle ~/.gradle -name "*.jar" -path "*minecraftMaven*" 2>/dev/null | grep "$v" | grep -iv sources | grep -E "client|merged" | head -1)
            echo "jar for $v: $JAR" >> notes/jars.txt
            [ -z "$JAR" ] && continue
            : > notes/$v.txt
            # сигнатуры
            for c in \
              net.minecraft.client.gui.screens.Screen \
              net.minecraft.client.gui.GuiGraphics \
              net.minecraft.client.gui.components.AbstractWidget \
              net.minecraft.client.gui.components.AbstractButton \
              net.minecraft.client.gui.components.Button \
              net.minecraft.client.gui.components.CycleButton \
              net.minecraft.client.gui.components.AbstractSliderButton \
              net.minecraft.client.gui.components.EditBox \
              net.minecraft.client.gui.components.Checkbox \
              net.minecraft.client.gui.components.AbstractSelectionList \
              net.minecraft.client.gui.components.AbstractScrollArea \
              net.minecraft.client.gui.components.ImageButton \
              net.minecraft.client.gui.components.WidgetSprites \
              net.minecraft.client.gui.components.tabs.TabButton \
              net.minecraft.client.gui.components.tabs.TabNavigationBar \
              net.minecraft.client.renderer.PanoramaRenderer \
              net.minecraft.client.renderer.CubeMap \
              net.minecraft.client.gui.screens.LoadingOverlay \
              net.minecraft.client.gui.screens.TitleScreen \
              net.minecraft.client.gui.screens.PauseScreen \
              com.mojang.blaze3d.platform.NativeImage \
              net.minecraft.client.renderer.texture.DynamicTexture \
              net.minecraft.client.renderer.texture.TextureManager \
              net.minecraft.client.renderer.RenderPipelines \
              net.minecraft.resources.ResourceLocation \
              net.minecraft.resources.Identifier \
              net.minecraft.client.gui.components.Tooltip \
              net.minecraft.client.gui.Font ; do
              echo "=== $c" >> notes/$v.txt
              javap -p -cp "$JAR" "$c" >> notes/$v.txt 2>&1 || true
            done
            # байткод методов отрисовки — чтобы видеть, что именно рисует игра
            : > notes/$v-code.txt
            for c in \
              net.minecraft.client.gui.components.AbstractButton \
              net.minecraft.client.gui.components.Button \
              net.minecraft.client.gui.components.AbstractSliderButton \
              net.minecraft.client.gui.components.Checkbox \
              net.minecraft.client.gui.components.AbstractSelectionList \
              net.minecraft.client.gui.components.AbstractScrollArea \
              net.minecraft.client.gui.components.tabs.TabButton \
              net.minecraft.client.gui.components.tabs.TabNavigationBar \
              net.minecraft.client.gui.screens.Screen ; do
              echo "=== $c" >> notes/$v-code.txt
              javap -p -c -cp "$JAR" "$c" 2>&1 | grep -E "^  [a-z].*\(|invoke|getstatic|putfield|getfield|ldc" | grep -vE "Narrat|narrat" >> notes/$v-code.txt || true
            done
            javap -p -c -cp "$JAR" net.minecraft.client.gui.components.EditBox 2>&1 | awk '/renderWidget/,/^$/' >> notes/$v-code.txt || true
            done
          done
          ls -la notes

      - name: Выложить заметки в ветку ci-notes
        if: always()
        run: |
          cp client/build.log notes/build.log 2>/dev/null || true
          cd notes
          git init -q -b ci-notes
          git config user.name "neon-ci"
          git config user.email "ci@neon.invalid"
          git add -A
          git commit -qm "ci notes ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-notes

      - name: Собранные jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neonclient
          path: client/*/build/libs/neonclient-*.jar
