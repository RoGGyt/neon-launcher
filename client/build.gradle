// Neon Client: интерфейс игры в стиле Neon. Собирается отдельно под каждую версию Minecraft.
plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT' apply false
}

subprojects {
    apply plugin: 'fabric-loom'

    group = 'dev.neon'
    version = '2.0.0'
    base { archivesName = "neonclient-${project.name}" }

    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
    }

    def loaderVersion = rootProject.findProperty('loader_version') ?: '0.16.14'
    def tourMode = rootProject.findProperty('tour')
    def quickPlay = rootProject.findProperty('qp')
    def autoHost = rootProject.findProperty('autohost')

    dependencies {
        minecraft "com.mojang:minecraft:${project.mc_version}"
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    }

    loom {
        def aw = file('src/main/resources/neonclient.accesswidener')
        if (aw.exists()) accessWidenerPath = aw
        runs {
            client {
                programArgs '--width', '1920', '--height', '1080'
                if (tourMode) vmArg "-Dneon.tour=${tourMode}"
                if (quickPlay) programArgs '--quickPlaySingleplayer', quickPlay.toString()
                if (autoHost) vmArg '-Dneon.autohost=true'
            }
        }
    }

    // общие ресурсы (шрифт, фон, иконки) лежат в client/common
    sourceSets.main.resources.srcDir rootProject.file('common/resources')

    processResources {
        inputs.property 'mc', project.mc_version
        filesMatching('fabric.mod.json') { expand 'mc': project.mc_version }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = (project.java_release as int)
    }

    java {
        sourceCompatibility = JavaVersion.toVersion(project.java_release)
        targetCompatibility = JavaVersion.toVersion(project.java_release)
    }
}
